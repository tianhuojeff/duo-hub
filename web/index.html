<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duo Hub — Codex 主管与 Gemini 协作看板</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/supervisor_status.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="logo">⚡ Duo Hub</span>
    <span class="subtitle">Codex 主管与可插拔 Agent 看板</span>
  </div>
  <div class="topbar-right">
    <span id="gateway-indicators" class="gateway-indicators"></span>
    <span class="version-badge" id="app-version">v---</span>
    <span class="session-badge" id="session-id">会话 #---</span>
  </div>
</header>

<section class="star-map-window" aria-label="协作星图">
  <div class="map-header">
    <div class="map-title">
      <span class="map-kicker">JARVIS ORBIT</span>
      <span class="map-name">AI语义控制台</span>
    </div>
    <div class="map-readouts" id="map-agent-readouts"></div>
    <button class="map-gesture" id="btn-map-gesture" type="button" title="开启手势控制" aria-label="开启手势控制">手势</button>
    <button class="map-expand" id="btn-map-expand" type="button" title="放大星图" aria-label="放大星图">⛶</button>
  </div>
  <div class="map-viewport" id="star-map-viewport">
    <canvas id="graph-canvas" aria-hidden="true"></canvas>
    <span class="map-reticle"></span>
  </div>
</section>

<section class="supervisor-status-section" aria-label="Agent 分工状态">
  <div class="section-label">🧭 Agent 分工状态</div>
  <div id="supervisor-status-root"></div>
</section>

<div class="main-grid" id="agent-panels"></div>

<!-- 对话历史 -->
<section class="chat-section">
  <div class="section-label">📜 Codex 主管与 Agent 记录</div>
  <div class="chat-messages" id="chat-messages">
    <div class="chat-empty">主对话在 Codex；这里展示对已启用 Agent 的派发、回包与证据…</div>
  </div>
</section>

<!-- 输入区域 -->
<footer class="input-area">
  <!-- 确认操作栏 (pending_confirmation 时显示) -->
  <div class="confirm-bar" id="confirm-bar" style="display:none">
    <span class="confirm-icon">📋</span>
    <span class="confirm-text" id="confirm-text">协商完成，请确认分工方案：</span>
    <button class="btn btn-confirm" id="btn-confirm">✅ 确认执行</button>
    <button class="btn btn-feedback" id="btn-feedback">✏️ 按输入修改</button>
    <button class="btn btn-renegotiate" id="btn-renegotiate">🔄 继续协商</button>
    <button class="btn btn-cancel" id="btn-cancel-division">↩ 先不执行</button>
  </div>

  <!-- 分工结果统一展示区 -->
  <div class="division-result" id="division-result" style="display:none">
    <div class="division-header">🤝 协商分工结果</div>
    <div class="division-body" id="division-body"></div>
  </div>

  <div class="input-row">
    <textarea
      id="task-input"
      placeholder="📝 可手动记录/测试；Agent 分工由 Codex 主管派发… (Ctrl+Enter)"
      rows="2"
    ></textarea>
    <div class="btn-group">
      <label class="checkbox-label" title="勾选后按当前 Agent Registry 生成分工">
        <input type="checkbox" id="chk-division"> 🤝 需要分工
      </label>
      <label class="checkbox-label" title="勾选后才会实际调用当前启用的 Agent，可能消耗模型额度">
        <input type="checkbox" id="chk-paid-agents"> 💰 启用 Agent 调用
      </label>
      <button class="btn btn-primary" id="btn-send" title="发送任务 (Ctrl+Enter)">
        🚀 手动发送
      </button>
    </div>
  </div>
  <div class="action-row">
    <div class="action-left">
      <button class="btn btn-sm btn-loop" id="btn-loop-scan" title="不调用模型，只扫描本地 Loop 状态">↻ Loop 扫描</button>
      <button class="btn btn-sm btn-stop" id="btn-stop">⏹ 重置会话</button>
      <span class="loop-status" id="loop-status">Loop 未扫描</span>
    </div>
    <span class="phase-indicator" id="phase-text">就绪</span>
  </div>
</footer>

<script src="/supervisor_status.js"></script>
<script src="/app.js"></script>
</body>
</html>
